<svg viewBox="0 0 640 680" width="640" height="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pricingChartTitle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="pricingChartTitle">What happens to your gateway cost when traffic grows</title>

  <line x1="50" y1="40.0" x2="50" y2="480.0" stroke="#313742" stroke-width="1.5" />
  <line x1="50" y1="480.0" x2="600" y2="480.0" stroke="#313742" stroke-width="1.5" />

  <!-- Tyk Enterprise: smooth upward curve, scaling with traffic/API count/scope, no published ceiling. -->
  <path d="M 50,460 C 180,452 250,430 320,395 C 390,360 440,300 490,220 C 530,155 565,95 600,42" fill="none" stroke="#ff7a45" stroke-width="4" stroke-linecap="round" />

  <!-- KrakenD: flat per-tier plan for year 1 and most of year 2, one plan change mid-year 2, still well below Tyk's curve on nearly every month. -->
  <path d="M 50,433.6 L 309.2,433.6 L 309.2,334.6 L 600,334.6" fill="none" stroke="#ab83ff" stroke-width="4" stroke-linecap="round" />

  <line x1="230.8" y1="472.0" x2="230.8" y2="488.0" stroke="#313742" stroke-width="1.5" />
  <line x1="419.2" y1="472.0" x2="419.2" y2="488.0" stroke="#313742" stroke-width="1.5" />

  <text x="136.4" y="516.0" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.04em" fill="#717da3">Year 1</text>
  <text x="325.0" y="516.0" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.04em" fill="#717da3">Year 2</text>
  <text x="513.5" y="516.0" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.04em" fill="#717da3">Year 3</text>

  <text x="18" y="260.0" text-anchor="middle" transform="rotate(-90 18 260)" font-size="13" fill="#a2a9be">Cost</text>

  <!-- Legend -->
  <line x1="50" y1="592.0" x2="70" y2="592.0" stroke="#ab83ff" stroke-width="4" stroke-linecap="round" />
  <text x="78" y="600.0" font-size="15" fill="#c9d3ee">KrakenD: flat-tiered plans, predictable at every scale</text>

  <line x1="50" y1="624.0" x2="70" y2="624.0" stroke="#ff7a45" stroke-width="4" stroke-linecap="round" />
  <text x="78" y="632.0" font-size="15" fill="#c9d3ee">Tyk Enterprise: scales with your usage, no published pricing</text>
</svg>
