<svg viewBox="0 0 640 680" width="640" height="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pricingChartTitle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="pricingChartTitle">What happens to your gateway cost when traffic grows</title>

