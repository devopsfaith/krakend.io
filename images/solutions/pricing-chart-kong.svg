  <!-- KrakenD: flat per instance tier for year 1 and most of year 2, one plan change mid-year 2, a big jump, still well below Apigee's trend on nearly every month. -->
  <path d="M 50,433.6 L 309.2,433.6 L 309.2,334.6 L 600,334.6" fill="none" stroke="#ab83ff" stroke-width="4" stroke-linecap="round" />

